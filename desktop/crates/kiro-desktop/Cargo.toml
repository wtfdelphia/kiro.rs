[package]
name = "kiro-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "kiro-desktop"
path = "src/main.rs"

[dependencies]
kiro-rs = { path = "../../.." }
gpui-kit = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
axum = "0.8"
futures = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = { version = "4", default-features = true }
parking_lot = "0.12"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
open = "5"
# change 6：系统托盘。ksni 后端 = 纯 D-Bus StatusNotifierItem，
# 无 GTK 依赖（见 openspec/changes/desktop-tray-resident/evidence/tray-icon-0.25-ksni.md）
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

# change 6：Windows 开机自启走注册表（target-gated，本环境只编译验证）
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
gpui = { package = "gpui-pre", version = "0.3.4", features = ["test-support"] }
gpui-kit = { version = "0.6", features = ["test-support"] }

# change 7：cargo-packager 打包配置（design D1：配置放 manifest，
# formats 经 CLI `--formats` 按平台驱动，不在共享配置里写死，
# 避免 Linux 默认格式带上需要 FUSE + 外部下载的 AppImage）。
# 图标 / installer-icon 相对 crate 目录；binaries/out_dir 默认指向
# target/<profile>，无需手写。
[package.metadata.packager]
productName = "kiro-rs"
identifier = "dev.kiro-rs.desktop"
description = "kiro-rs 桌面端：Anthropic Claude 兼容代理 + 管理界面 + 托盘常驻"
homepage = "https://github.com/wtfdelphia/kiro.rs"
authors = ["kiro-rs maintainers"]
category = "Utility"
icons = ["../../assets/icons/icon_*.png"]

# 显式声明：metadata 模式下工具自动收集全部 bin target，
# 不声明会把 src/bin/ 下两个 spike 取证程序一起打进包
[[package.metadata.packager.binaries]]
path = "kiro-desktop"
main = true

[package.metadata.packager.deb]
depends = [
    "libxau6",
    "libxdmcp6",
    "libbsd0",
    "libmd0",
    "libxcb1",
    "libxcb-xkb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
]

[package.metadata.packager.nsis]
installerIcon = "../../assets/icons/icon.ico"
