name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build label used only for publish=false dry runs.'
        required: true
        default: 'dry-run'
      publish:
        description: 'Push images to GHCR. Leave false for a build-only dry run.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      should_publish: ${{ steps.check.outputs.should_publish }}
      enforce_version: ${{ steps.check.outputs.enforce_version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check if commit has release tag
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/heads/* ]] && git tag --points-at HEAD | grep -q '^v'; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping beta build: commit already has a release tag"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

          # Publishing side effects require either an automatic trigger from
          # main/tag, or an explicit opt-in on the manual trigger. Computed
          # here (a non-matrix job) because a matrix job's outputs resolve to
          # whichever leg finishes last.
          #
          # Manual publishing also resolves the release identity here so no
          # matrix leg can select or override the public image version.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.publish }}" == "true" ]]; then
              echo "should_publish=true" >> $GITHUB_OUTPUT
              RELEASE_TAG=$(python scripts/check_release_version.py resolve --commit "${{ github.sha }}")
              echo "enforce_version=true" >> $GITHUB_OUTPUT
              echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
            else
              echo "should_publish=false" >> $GITHUB_OUTPUT
              echo "enforce_version=false" >> $GITHUB_OUTPUT
              echo "release_tag=" >> $GITHUB_OUTPUT
              echo "::notice::Dry run: images will be built but not pushed"
            fi
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "enforce_version=true" >> $GITHUB_OUTPUT
            echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "enforce_version=false" >> $GITHUB_OUTPUT
            echo "release_tag=" >> $GITHUB_OUTPUT
          fi

  warning-gate:
    needs: pre-check
    if: needs.pre-check.outputs.should_build == 'true'
    uses: ./.github/workflows/warning-gate.yaml

  version-gate:
    needs: pre-check
    uses: ./.github/workflows/version-gate.yaml
    with:
      enforce: ${{ needs.pre-check.outputs.enforce_version == 'true' }}
      release_tag: ${{ needs.pre-check.outputs.release_tag }}
      release_commit: ${{ github.sha }}

  build:
    needs:
      - pre-check
      - warning-gate
      - version-gate
    if: needs.pre-check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_beta: ${{ steps.version.outputs.is_beta }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ needs.pre-check.outputs.release_tag }}" ]; then
            echo "version=${{ needs.pre-check.outputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "is_beta=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "is_beta=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
            echo "version=beta-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "is_beta=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: needs.pre-check.outputs.should_publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha
          cache-to: ${{ needs.pre-check.outputs.should_publish == 'true' && 'type=gha,mode=max' || '' }}
          push: ${{ needs.pre-check.outputs.should_publish == 'true' }}
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/kiro-rs:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Kiro.rs Docker Image

  manifest:
    needs:
      - pre-check
      - build
    if: needs.pre-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Create and push multi-arch manifest
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          IS_BETA="${{ needs.build.outputs.is_beta }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/kiro-rs"

          # Create manifest for version tag
          docker manifest create ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64
          docker manifest push ${IMAGE}:${VERSION}

          # Create manifest for latest/beta alias tag
          if [ "${IS_BETA}" = "true" ]; then
            ALIAS_TAG="beta"
          else
            ALIAS_TAG="latest"
          fi
          docker manifest create ${IMAGE}:${ALIAS_TAG} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64
          docker manifest push ${IMAGE}:${ALIAS_TAG}
